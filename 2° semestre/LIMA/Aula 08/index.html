<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discoteca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Discoteca 🪩</h1>
        <p>Venda de Discos</p>
    </header>
    <main class = "container">
        <div>
        <div class = "titulo-secao">
        </div>
        <button id = "btnCadastrar" type="button"> + Cadastrar disco</button>
    </div>
    <section id ="listarDiscos" class = "listar-discos">
        <p id="mensagemVazia" class = listar-discos></p>
    </section>
    </main>
    <dialog id="modalCadastro">
        <h2> Novo Disco </h2>
        <form id="formDisco">
            <label> Nome do Disco</label>
            <input type="text" id="disco" required>
            <label> Artista ou Banda</label>
            <input type="text" id="Artista" required>
            <label> Genero Musical</label>
            <input type="text" id="genero" required>
            <label> URL da Imagem </label>
            <input type ="url" id = "imagem" placeholder="https://site.com/capa.jpg" required>
            <label> Preço (R$) </label>
            <input type="number" id="preco" min="0.01" step="0.01" required>
            <div class = "açoes">
                <button type="button" id = "btnCancelar" 
                class="cancelar">Cancelar</button>
                <button type="submit">Salvar Disco</button>
            </div>
        </form>
    </dialog>
</body>
</html>
