<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <div class="card">
            <h1>Cadastro de Aluno</h1>
            <input
                type="text"
                id="nome"
                placeholder="Nome"
            >
            <input
                type="email"
                id="email"
                placeholder="E-mail"
            >
            <input
                type="mat"
                id="matricula"
                placeholder="Matrícula"
            >
            <button id="salvar">
                Salvar
            </button>
        </div>
        <div class="card tabela-container">
            <h2>Cadastros dos Alunos</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Matrícula</th>
                    </tr>
                </thead>
                <tbody id="tabela">
                </tbody>
            </table>
        </div>
    </main>
    <main class="container">
        <div class="card">
            <h1>Cadastro de Professor</h1>
            <input
                type="text"
                id="nome1"
                placeholder="Nome"
            >
            <input
                type="email"
                id="email1"
                placeholder="E-mail"
            >
            <input
                type="dis"
                id="disciplina1"
                placeholder="Disciplina"
            >
            <button id="salvar1">
                Salvar
            </button>
        </div>
        <div class="card tabela-container">
            <h2>Cadastro de Professor</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Disciplina</th>
                    </tr>
                </thead>
                <tbody id="tabela1">
                </tbody>
            </table>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
