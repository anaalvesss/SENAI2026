<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos Quitanda</title>
</head>
<body>
    <center>
        <h1>Novo Pedido</h1>
        <form action="http://127.0.0.1:3000" method="post">
        <input type="text" placeholder="Identificacao" name="id" required><br></br>
        <input type="text" placeholder="Nome do Produto" name="nome" required><br></br>
        <select name="unidade" required>
            <option value="Kg">Kg</option>
            <option value="Unidade">Unidade</option><br></br>
        </select><br>
        <input type="number" step ="0.01" placeholder="Preço unitário" name="precoUnitario" required><br></br>
        <input type="number" placeholder="Quantidade do Produto" name="quantidade" required><br></br>
        <button type="reset">Limpar</button>
        <button type="submit">Enviar</button>
        </form>
    </center>
</body>
</html>
